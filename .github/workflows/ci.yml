name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Types, unit and handler tests, and the bundle check (made-up secrets must stay out of dist/). Runs in parallel with e2e.
  static:
    name: Types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Types
        run: npm run lint
      - name: Unit and handler tests
        run: npm test
      - name: Build with made-up secrets (they must stay out of the bundle)
        run: |
          npm run build
          node scripts/check-bundle.mjs dist
        env:
          # Names as the Vercel integration creates them; the values are fake. The first three are secrets and must
          # not reach dist/; the public ones must (otherwise the login would be missing in the browser).
          DATABASE_SUPABASE_SERVICE_ROLE_KEY: canary-service-role-key-4f9a1c
          DATABASE_SUPABASE_JWT_SECRET: canary-jwt-secret-7b2e5d
          DATABASE_POSTGRES_PASSWORD: canary-postgres-password-9c3d8e
          DATABASE_VITE_SUPABASE_URL: https://canarycanarycanary00.supabase.co
          DATABASE_VITE_SUPABASE_ANON_KEY: canary-anon-key-public-2a6b
          CANARY_SECRET_VARS: DATABASE_SUPABASE_SERVICE_ROLE_KEY,DATABASE_SUPABASE_JWT_SECRET,DATABASE_POSTGRES_PASSWORD
          CANARY_PUBLIC_VARS: DATABASE_VITE_SUPABASE_URL,DATABASE_VITE_SUPABASE_ANON_KEY

  # The end-to-end suite is split in two shards that run at the same time (Playwright --shard)
  e2e:
    name: End-to-end (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build for the end-to-end tests
        run: npm run build:e2e

      - name: Browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (shard ${{ matrix.shard }} of 2)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
        env:
          E2E_SKIP_BUILD: '1'

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The one status the branch protection requires (see AGENTS.md): passes only when every job above passed
  checks:
    name: checks
    needs: [static, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
