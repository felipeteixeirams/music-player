name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the end-to-end suite is needed: every push to main, and any pull request that changes code,
  # tests, the build or the configuration. A pull request that only changes documentation skips it.
  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if echo "$changed" | grep -Eq '^(src/|api/|public/|tests/|scripts/|server\.ts$|index\.html$|vite\.config\.ts$|playwright\.config\.ts$|package(-lock)?\.json$|vercel\.json$|tsconfig[^/]*\.json$|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Types, unit and handler tests, and the bundle check (made-up secrets must stay out of dist/). Always runs.
  static:
    name: Types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Types
        run: npm run lint
      - name: Unit and handler tests
        run: npm test
      - name: Build with made-up secrets (they must stay out of the bundle)
        run: |
          npm run build
          node scripts/check-bundle.mjs dist
        env:
          # Names as the Vercel integration creates them; the values are fake. The first three are secrets and must
          # not reach dist/; the public ones must (otherwise the login would be missing in the browser).
          DATABASE_SUPABASE_SERVICE_ROLE_KEY: canary-service-role-key-4f9a1c
          DATABASE_SUPABASE_JWT_SECRET: canary-jwt-secret-7b2e5d
          DATABASE_POSTGRES_PASSWORD: canary-postgres-password-9c3d8e
          DATABASE_VITE_SUPABASE_URL: https://canarycanarycanary00.supabase.co
          DATABASE_VITE_SUPABASE_ANON_KEY: canary-anon-key-public-2a6b
          CANARY_SECRET_VARS: DATABASE_SUPABASE_SERVICE_ROLE_KEY,DATABASE_SUPABASE_JWT_SECRET,DATABASE_POSTGRES_PASSWORD
          CANARY_PUBLIC_VARS: DATABASE_VITE_SUPABASE_URL,DATABASE_VITE_SUPABASE_ANON_KEY

  # The end-to-end suite, in two shards that run at the same time. Skipped when a pull request changes no code.
  e2e:
    name: End-to-end (shard ${{ matrix.shard }} of 2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build for the end-to-end tests
        run: npm run build:e2e

      - name: Browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (shard ${{ matrix.shard }} of 2)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
        env:
          E2E_SKIP_BUILD: '1'

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The one status the branch protection requires (see AGENTS.md). Passes when the static checks passed and the
  # end-to-end suite either passed or was skipped on purpose (a pull request with no code change).
  checks:
    name: checks
    needs: [changes, static, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        run: |
          test "${{ needs.changes.result }}" = "success"
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success" -o "${{ needs.e2e.result }}" = "skipped"
