<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#141126" />
      <stop offset="100%" stop-color="#07070e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Ambient Inner Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8" />
  
  <!-- Soundwave Bars & Musical Note Geometry -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Central Soundwave Bars -->
    <rect x="-110" y="-40" width="20" height="80" rx="10" fill="url(#glowGrad)" />
    <rect x="-70" y="-80" width="20" height="160" rx="10" fill="url(#accentGrad)" />
    <rect x="-30" y="-120" width="20" height="240" rx="10" fill="url(#glowGrad)" />
    <rect x="10" y="-140" width="20" height="280" rx="10" fill="url(#accentGrad)" />
    <rect x="50" y="-90" width="20" height="180" rx="10" fill="url(#glowGrad)" />
    <rect x="90" y="-50" width="20" height="100" rx="10" fill="url(#accentGrad)" />
  </g>
</svg>
